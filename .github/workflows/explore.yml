name: Explore

on:
  workflow_dispatch:
  schedule:
    - cron: "41 16 * * 2"

permissions:
  contents: read

concurrency:
  group: explore-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Binary and topology reports
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refresh package index
        run: sudo apt-get update
      - name: Install exploration tools
        run: >-
          sudo apt-get install --yes --no-install-recommends
          clang-18 dwarves hwloc llvm-18 ninja-build
      - name: Collect compiler optimisation report
        run: make report PRESET=profile TARGET=m0
      - name: Collect local reports
        run: make explore all PRESET=profile TARGET=m0
