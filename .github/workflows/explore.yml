name: Explore

on:
  workflow_dispatch:
  schedule:
    - cron: "41 16 * * 2"

permissions:
  contents: read

concurrency:
  group: explore-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Binary and topology reports
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refresh package index
        run: sudo apt-get update
      - name: Install exploration tools
        run: >-
          sudo apt-get install --yes --no-install-recommends
          clang-18 dwarves hwloc libluajit-5.1-dev llvm-18 ninja-build
          pkg-config
      - name: Collect compiler optimisation report
        run: >-
          ./tools/scripts/tools/summary explore-report --
          make report PRESET=profile TARGET=m1
      - name: Collect local reports
        run: >-
          ./tools/scripts/tools/summary explore-all --
          make explore all PRESET=profile TARGET=m1
      - name: Save exploration reports
        if: always()
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: explore-linux
          path: |
            results/actions/
            results/profiles/
            build/profile/reports/
          if-no-files-found: ignore
          retention-days: 7
