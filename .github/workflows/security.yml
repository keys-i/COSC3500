name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL / C++
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialise CodeQL
        # v4.37.8
        uses: >-
          github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Refresh package index
        run: sudo apt-get update
      - name: Install compiler
        run: >-
          sudo apt-get install --yes --no-install-recommends
          g++-14 ninja-build
      - name: Build for CodeQL
        run: make codeql PRESET=bunya-check
      - name: Analyse
        # v4.37.8
        uses: >-
          github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28

  static:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CC: clang-18
      CXX: clang++-18
      GXX: g++-14
      SCAN_BUILD: scan-build-18
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refresh package index
        run: sudo apt-get update
      - name: Install analyzers
        run: >-
          sudo apt-get install --yes --no-install-recommends
          clang-18 clang-tools-18 g++-14 ninja-build
      - name: Run Clang Static Analyzer and GCC fanalyzer
        run: make check analyze PRESET=rangpur-check

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan + LSan
            san: au
          - name: TSan
            san: t
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refresh package index
        run: sudo apt-get update
      - name: Install compiler
        run: >-
          sudo apt-get install --yes --no-install-recommends
          clang-18 ninja-build
      - name: Run sanitizer
        run: make san ${{ matrix.san }}

  optional:
    name: Optional checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Try MSan
        run: make san m

  valgrind:
    name: Valgrind / ${{ matrix.tool }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tool: [memcheck, helgrind, drd]
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refresh package index
        run: sudo apt-get update
      - name: Install Valgrind and compiler
        run: >-
          sudo apt-get install --yes --no-install-recommends
          clang-18 ninja-build valgrind
      - name: Run Valgrind tool
        run: make profile ${{ matrix.tool }}
