name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL / C++
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Initialise CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build
      - name: Build C++ inputs
        run: make m PRESET=dev
      - name: Build summary
        run: |
          printf "## CodeQL build: PASS\n\n- Command: \`make m PRESET=dev\`\n" >> "$GITHUB_STEP_SUMMARY"
      - name: Analyse
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
      - name: Analysis summary
        run: |
          printf "## CodeQL analysis: PASS\n" >> "$GITHUB_STEP_SUMMARY"
  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang cmake ninja-build
      - name: Run ASan and UBSan
        run: make security SAN=au PRESET=dev
      - name: Summary
        run: |
          printf "## ASan and UBSan: PASS\n\n- Command: \`make security SAN=au PRESET=dev\`\n" >> "$GITHUB_STEP_SUMMARY"

  valgrind:
    name: Valgrind / Memcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build valgrind
      - name: Run Memcheck
        run: make valgrind PRESET=dev
      - name: Summary
        run: |
          printf "## Memcheck: PASS\n\n- Command: \`make valgrind PRESET=dev\`\n" >> "$GITHUB_STEP_SUMMARY"
