name: Security

on:
  pull_request:
    paths: &security_paths
      - '.github/workflows/security.yml'
      - '.github/workflows/scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'Makefile'
      - 'benches/**'
      - 'proj/m0/main.cpp'
      - 'proj/m1/**'
      - 'tools/**'
  push:
    branches: [main]
    paths: *security_paths
  schedule:
    - cron: "23 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL / C++
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        # v7.0.1
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Initialise CodeQL
        # v4.37.9
        uses: >-
          github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Build C++ inputs
        run: make m PRESET=dev
      - name: Inspect native binary
        run: .github/workflows/scripts/report.sh binary
      - name: Analyse
        # v4.37.9
        uses: >-
          github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938

  sanitizers:
    name: Sanitizer / ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ASan + UBSan
            mode: au
          - label: LSan
            mode: l
          - label: TSan
            mode: t
    steps:
      - name: Check out repository
        # v7.0.1
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run ${{ matrix.label }}
        env:
          REPORT_KIND: san
          REPORT_LABEL: ${{ matrix.label }}
          REPORT_MODE: ${{ matrix.mode }}
        run: .github/workflows/scripts/report.sh security

  valgrind:
    name: Valgrind / Memcheck + profilers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        # v7.0.1
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends valgrind
      - name: Run Memcheck
        env:
          REPORT_KIND: valgrind
          REPORT_LABEL: Memcheck
          REPORT_MODE: memcheck
        run: .github/workflows/scripts/report.sh security
      - name: Run Cachegrind
        if: github.event_name != 'pull_request'
        env:
          REPORT_KIND: valgrind
          REPORT_LABEL: Cachegrind
          REPORT_MODE: cachegrind
        run: .github/workflows/scripts/report.sh security
      - name: Run Callgrind
        if: github.event_name != 'pull_request'
        env:
          REPORT_KIND: valgrind
          REPORT_LABEL: Callgrind
          REPORT_MODE: callgrind
        run: .github/workflows/scripts/report.sh security
      - name: Run Massif
        if: github.event_name != 'pull_request'
        env:
          REPORT_KIND: valgrind
          REPORT_LABEL: Massif
          REPORT_MODE: massif
        run: .github/workflows/scripts/report.sh security

  msan:
    name: MSan / instrumented libc++
    if: vars.MSAN_ENABLED == 'true' && vars.MSAN_RUNNER != ''
    runs-on: ${{ vars.MSAN_RUNNER }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        # v7.0.1
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run MSan
        env:
          MSAN_LIBCXX: /opt/msan-libcxx
          REPORT_KIND: san
          REPORT_LABEL: MSan / instrumented libc++
          REPORT_MODE: m
        run: .github/workflows/scripts/report.sh security
