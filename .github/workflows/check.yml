name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-15
    steps:
      - name: Check out repository
        # v7.0.1
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install FFmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Set up uv
        # v10.0.1
        uses: >-
          astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.2
          python-version: '3.13'
          enable-cache: true
      - name: Install visual test runtime
        run: uv sync --locked
      - name: Build and test
        env:
          CTEST_EXCLUDE_REGEX: ${{ runner.os == 'macOS' && '^m1\.visualiser' || '' }}
          CTEST_PARALLEL_LEVEL: 2
          TEST_SEED_CONTRACTS: ${{ runner.os == 'macOS' && '0' || '1' }}
        run: .github/workflows/scripts/report.sh test

  quality:
    name: Format, lint, and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_NO_SYNC: 1
    steps:
      - name: Check out repository
        # v7.0.1
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Lua linters
        run: .github/workflows/scripts/lua-tools.sh
      - name: Set up uv
        # v10.0.1
        uses: >-
          astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.2
          enable-cache: true
      - name: Install Python quality tools
        run: uv sync --locked --only-group dev
      - name: Check formatting
        run: make fmt
      - name: Run linters and type-checkers
        run: make lint PRESET=dev
      - name: Summarise checked surface
        run: .github/workflows/scripts/report.sh quality

  coverage:
    name: LLVM coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        # v7.0.1
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang llvm cmake ninja-build
      - name: Build, test, and report coverage
        run: .github/workflows/scripts/report.sh coverage
