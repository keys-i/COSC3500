name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ffmpeg ninja-build
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v0.12.2
        with:
          version: 0.12.2
          enable-cache: true
      - name: Install visual test runtime
        run: uv sync --locked
      - name: Build and test
        run: tools/scripts/test.sh test
      - name: Summary
        run: |
          printf "## Test: PASS\n\n- Command: \`tools/scripts/test.sh test\`\n" >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Format, lint, and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang-format clang-tidy cmake ninja-build
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v0.12.2
        with:
          version: 0.12.2
          enable-cache: true
      - name: Install Python quality tools
        run: uv sync --locked
      - name: Check formatting
        run: make fmt
      - name: Format summary
        run: |
          printf "## Format: PASS\n\n- Command: \`make fmt\`\n" >> "$GITHUB_STEP_SUMMARY"
      - name: Run linters
        run: make lint PRESET=dev
      - name: Lint summary
        run: |
          printf "## Lint: PASS\n\n- Command: \`make lint PRESET=dev\`\n" >> "$GITHUB_STEP_SUMMARY"
      - name: Check Python types
        run: make typecheck
      - name: Type-check summary
        run: |
          printf "## Type-check: PASS\n\n- Command: \`make typecheck\`\n" >> "$GITHUB_STEP_SUMMARY"

  coverage:
    name: LLVM coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang llvm cmake ninja-build
      - name: Build, test, and print coverage
        run: make cov | tee coverage.txt
      - name: Summary
        run: |
          {
            printf "## Coverage: PASS\n\n- Command: \`make cov\`\n\n\`\`\`text\n"
            awk '/^Filename/{report=1} report' coverage.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

  visualise:
    name: Visualise
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up uv
        # v9.0.0
        uses: >-
          astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.2
          enable-cache: true
      - name: Install visual runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ffmpeg ninja-build
          uv sync --locked
      - name: Check visualisation
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: uv run --locked --offline tests/visual/test_renderer.py
      - name: Summary
        run: |
          printf "## Visualise: PASS\n\n- Command: \`uv run --locked --offline tests/visual/test_renderer.py\`\n" >> "$GITHUB_STEP_SUMMARY"
