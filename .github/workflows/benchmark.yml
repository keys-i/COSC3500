name: Benchmark

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Benchmark smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build
      - name: Build, benchmark, and summarise
        run: |
          set -Eeuo pipefail
          SAMPLES=3 MINIMUM_CASE_MS=50 tools/scripts/test.sh bench
          cat results/bench/summary.md >> "$GITHUB_STEP_SUMMARY"
