name: Benchmark

on:
  pull_request:
    paths: &benchmark_paths
      - '.github/workflows/benchmark.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'Makefile'
      - 'benches/**'
      - 'proj/m0/main.cpp'
      - 'proj/m1/**'
      - 'tools/config/benchmark.yml'
      - 'tools/config/toolchains/**'
      - 'tools/scripts/tools/bench'
      - 'tools/scripts/tools/install'
      - 'tools/scripts/tools/lib.sh'
      - 'tools/scripts/tools/make'
      - 'tools/scripts/tools/summary'
  push:
    branches: [main]
    paths: *benchmark_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Benchmark smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build
      - name: Build, benchmark, and summarise
        run: |
          set -Eeuo pipefail
          SAMPLES=3 MINIMUM_CASE_MS=50 tools/scripts/test.sh bench
          cat results/bench/summary.md >> "$GITHUB_STEP_SUMMARY"
