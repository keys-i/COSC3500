name: Benchmark

on:
  pull_request:
    paths: &benchmark_paths
      - '.github/workflows/benchmark.yml'
      - '.github/workflows/scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'Makefile'
      - 'benches/**'
      - 'proj/m0/main.cpp'
      - 'proj/m1/**'
      - 'tools/**'
  push:
    branches: [main]
    paths: *benchmark_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Benchmark smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        # v7.0.1
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build and run benchmark smoke test
        run: .github/workflows/scripts/report.sh smoke

  perf:
    name: Linux perf counters
    if: >-
      vars.PERF_ENABLED == 'true' && vars.PERF_RUNNER != '' &&
      github.event_name != 'pull_request'
    runs-on: ${{ vars.PERF_RUNNER }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        # v7.0.1
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Record hardware counters
        run: .github/workflows/scripts/report.sh perf
